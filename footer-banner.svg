    </line>
    <line x1="1000" y1="90" x2="1110" y2="-20" stroke="#005A9C" stroke-width="18" opacity="0.65"/>
    <line x1="1250" y1="110" x2="1380" y2="-20" stroke="#00C8FF" stroke-width="5" opacity="0.8">
