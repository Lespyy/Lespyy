<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="termclip"><rect width="700" height="300" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#termclip)">
    <rect width="700" height="300" fill="#060B16"/>
    <rect x="0" y="0" width="700" height="34" fill="#0A0F1E"/>
    <circle cx="20" cy="17" r="6" fill="#FF5F56"/>
    <circle cx="42" cy="17" r="6" fill="#FFBD2E"/>
    <circle cx="64" cy="17" r="6" fill="#27C93F"/>
    <text x="350" y="21" font-family="'Courier New',monospace" font-size="12" fill="#7A7A7A" text-anchor="middle">danilo@portfolio: ~</text>

    <text x="24" y="74" font-family="'Courier New',monospace" font-size="15" fill="#00C8FF" opacity="0">$ whoami<animate attributeName="opacity" begin="0.2s" dur="0.4s" values="0;1" fill="freeze"/></text>
    <text x="44" y="98" font-family="'Courier New',monospace" font-size="15" fill="#E6E6E6" opacity="0">&gt; Danilo Rinaldi<animate attributeName="opacity" begin="0.9s" dur="0.4s" values="0;1" fill="freeze"/></text>

    <text x="24" y="122" font-family="'Courier New',monospace" font-size="15" fill="#00C8FF" opacity="0">$ cat role.txt<animate attributeName="opacity" begin="1.7s" dur="0.4s" values="0;1" fill="freeze"/></text>
    <text x="44" y="146" font-family="'Courier New',monospace" font-size="15" fill="#E6E6E6" opacity="0">&gt; Computer Engineering Student @ PoliTo 🎓<animate attributeName="opacity" begin="2.4s" dur="0.4s" values="0;1" fill="freeze"/></text>

    <text x="24" y="170" font-family="'Courier New',monospace" font-size="15" fill="#00C8FF" opacity="0">$ cat mission.txt<animate attributeName="opacity" begin="3.2s" dur="0.4s" values="0;1" fill="freeze"/></text>
    <text x="44" y="194" font-family="'Courier New',monospace" font-size="15" fill="#E6E6E6" opacity="0">&gt; Flight software for the ISS — ESA Astro Pi 🛰️<animate attributeName="opacity" begin="3.9s" dur="0.4s" values="0;1" fill="freeze"/></text>

    <text x="24" y="218" font-family="'Courier New',monospace" font-size="15" fill="#00C8FF" opacity="0">$ cat interests.txt<animate attributeName="opacity" begin="4.7s" dur="0.4s" values="0;1" fill="freeze"/></text>
    <text x="44" y="242" font-family="'Courier New',monospace" font-size="15" fill="#E6E6E6" opacity="0">&gt; data analysis · climate change · open source 🌍<animate attributeName="opacity" begin="5.4s" dur="0.4s" values="0;1" fill="freeze"/></text>

    <text x="24" y="266" font-family="'Courier New',monospace" font-size="15" fill="#00C8FF" opacity="0">$<animate attributeName="opacity" begin="6.2s" dur="0.3s" values="0;1" fill="freeze"/></text>
    <rect x="36" y="255" width="9" height="15" fill="#00C8FF" opacity="0">
      <animate attributeName="opacity" begin="6.5s" dur="1s" values="1;0;1;0;1;0;1" repeatCount="indefinite"/>
    </rect>

    <rect x="0" y="34" width="700" height="4" fill="#00C8FF" opacity="0.06">
      <animate attributeName="y" values="34;296;34" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1" y="1" width="698" height="298" rx="14" fill="none" stroke="#003D66" stroke-width="1.5"/>
</svg>
