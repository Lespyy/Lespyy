<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00040D"/>
      <stop offset="50%" stop-color="#001126"/>
      <stop offset="100%" stop-color="#001B3D"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1600" height="200"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="200" fill="url(#bg)"/>

  <g clip-path="url(#clip)">
    <circle cx="40" cy="25" r="1.5" fill="#E6E6E6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="170" r="1.2" fill="#E6E6E6"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="45" r="1.8" fill="#E6E6E6"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="155" r="1" fill="#E6E6E6"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="20" r="1.3" fill="#E6E6E6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="25" r="1.4" fill="#E6E6E6"><animate attributeName="opacity" values="1;0.2;1" dur="3.1s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="1200" cy="165" r="1.6" fill="#E6E6E6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1320" cy="40" r="1.1" fill="#E6E6E6"><animate attributeName="opacity" values="1;0.2;1" dur="2.3s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="1420" cy="150" r="1.7" fill="#E6E6E6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="1550" cy="60" r="1.3" fill="#E6E6E6"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" begin="0.4s" repeatCount="indefinite"/></circle>

    <line x1="-100" y1="0" x2="140" y2="200" stroke="#003D66" stroke-width="55" opacity="0.55">
      <animateTransform attributeName="transform" type="translate" values="0,0; 18,0; 0,0" dur="7s" repeatCount="indefinite"/>
    </line>
    <line x1="70" y1="-20" x2="300" y2="220" stroke="#005A9C" stroke-width="16" opacity="0.7"/>
    <line x1="280" y1="0" x2="440" y2="200" stroke="#00C8FF" stroke-width="4" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.25;0.85;0.85;0.5;0.85" dur="2.6s" repeatCount="indefinite"/>
    </line>
    <line x1="1130" y1="-20" x2="940" y2="220" stroke="#003D66" stroke-width="80" opacity="0.45">
      <animateTransform attributeName="transform" type="translate" values="0,0; -15,0; 0,0" dur="8.5s" repeatCount="indefinite"/>
    </line>
    <line x1="1280" y1="0" x2="1110" y2="200" stroke="#005A9C" stroke-width="20" opacity="0.6"/>
    <line x1="1460" y1="-20" x2="1350" y2="220" stroke="#00C8FF" stroke-width="5" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.3;0.8;0.8;0.8;0.4;0.8" dur="3.1s" begin="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="1600" y1="0" x2="1490" y2="200" stroke="#001B3D" stroke-width="40" opacity="0.5"/>

    <g transform="translate(800,30)">
      <circle r="9" fill="#003D66" opacity="0.85"/>
      <circle r="9" fill="none" stroke="#00C8FF" stroke-width="0.8" opacity="0.5"/>
      <g>
        <rect x="-3" y="-1.2" width="6" height="2.4" rx="0.6" fill="#E6E6E6"/>
        <rect x="-7" y="-0.7" width="3.5" height="1.4" fill="#00C8FF"/>
        <rect x="3.5" y="-0.7" width="3.5" height="1.4" fill="#00C8FF"/>
        <animateMotion dur="5s" repeatCount="indefinite" path="M 0,-9 A 26,9 0 1,1 0,9 A 26,9 0 1,1 0,-9" rotate="auto"/>
      </g>
    </g>

    <rect x="0" y="-20" width="1600" height="6" fill="#00C8FF" opacity="0.12">
      <animate attributeName="y" values="-20;220;-20" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <ellipse cx="800" cy="100" rx="420" ry="70" fill="url(#glow)" filter="url(#soft)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <rect x="0" y="62" width="1600" height="82" fill="#000000" opacity="0.35"/>
  <text x="800" y="105" font-family="'Courier New', monospace" font-size="42" font-weight="700" fill="#00C8FF" text-anchor="middle">Hi there, I'm Danilo 👋</text>
  <text x="800" y="138" font-family="'Courier New', monospace" font-size="17" fill="#E6E6E6" text-anchor="middle">Computer Engineering Student @ Politecnico di Torino</text>
  <line x1="630" y1="153" x2="970" y2="153" stroke="#00C8FF" stroke-width="2" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.2s" repeatCount="indefinite"/>
  </line>
</svg>
